name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gate the deploy on the full verification suite: type-check (app + tests),
      # tests (incl. the NIST HMAC-DRBG known-answer vector), and the chi-square
      # uniformity check. A broken pipeline never reaches production.
      - run: npm run check
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Runs BOTH e2e specs. `test:a11y` used to be an alias for the entire
      # Playwright suite; now that it is scoped to the a11y specs, this step has
      # to name the command that still covers the claims suite too, or splitting
      # the scripts would have silently dropped it from deployment.
      - name: Browser claims and accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
