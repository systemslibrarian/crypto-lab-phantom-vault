name: Deploy to GitHub Pages

# One workflow, one gate. This lab used to split them: ci.yml ran type-check,
# the unit tests, the chi-square uniformity check and the build on every branch
# push and every pull request, while this workflow additionally ran the browser
# gate -- axe WCAG A/AA plus the rendered-claim e2e suite -- on push to main.
# Dependabot's auto-merge hung off the lighter of the two, so a bump only had to
# satisfy ci.yml to land on main, and the heavier gate then failed on the merge
# commit. Nothing goes red in between: the PR is green, the merge is clean, and
# main quietly stops shipping. Staleness is not a state anything reports.
#
# So the gate a bump merges against is now literally the gate the deploy runs --
# one `build` job, depended on by both `deploy` and `dependabot-auto-merge`.
# ci.yml is deleted rather than kept beside it: a second copy of a gate is how
# the two drifted apart in the first place.
on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait
  # on. Left unfiltered, exactly as ci.yml had it -- stamping `branches: [main]`
  # here would silently narrow the gate to main-targeting pull requests only.
  pull_request:
  # Required by the post-merge dispatch at the bottom of this file.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`. Now that pull_request is a trigger and
  # cancel-in-progress is on, a bare group would let a PR run cancel a live main
  # deploy -- and `cancelled` is one of the shapes that ships nothing while
  # looking like nothing went wrong.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Gate the deploy on the full verification suite: type-check (app + tests),
      # tests (incl. the NIST HMAC-DRBG known-answer vector), and the chi-square
      # uniformity check. A broken pipeline never reaches production.
      #
      # Spelled out as the three steps ci.yml ran, rather than the `npm run check`
      # alias they used to hide behind: this file now has to make the deleted
      # workflow's checks a subset provable by reading, not by expanding a package
      # script in your head. `check` is still exactly
      # `type-check && test && verify:uniformity`, and if it ever stops being,
      # this gate does not quietly change with it.
      - run: npm run type-check
      - run: npm test
      - run: npm run verify:uniformity
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Runs BOTH e2e specs. `test:a11y` used to be an alias for the entire
      # Playwright suite; now that it is scoped to the a11y specs, this step has
      # to name the command that still covers the claims suite too, or splitting
      # the scripts would have silently dropped it from deployment.
      - name: Browser claims and accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # A pull request is gated, never published. `!= 'pull_request'` and NOT
    # `== 'push'`: the latter reads as equivalent and also skips
    # workflow_dispatch, which is the one trigger the post-merge dispatch below
    # depends on -- the dispatched run would build, pass the gate, skip this job,
    # and leave the site exactly as stale as it was.
    #
    # Note this is safe to gate only because build and deploy are separate jobs.
    # Where they are one job, gating it off for pull requests disables the PR
    # gate itself, so the PR runs nothing and reports nothing.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # Dependabot only. `needs: build` is the whole safety argument, and it is the
  # SAME build job `deploy` needs -- so a bump cannot merge unless the thing that
  # would later block the deploy has already gone green on the PR. It used to
  # name ci.yml's `verify` job, a gate that could not see the browser suite, and
  # that gap is what this file exists to close.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- type-check, unit tests, the uniformity
      # check, the build, axe WCAG and the e2e claims -- judges a bump far better
      # than its version number does. A major that actually breaks this lab fails
      # the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          #
          # The filename below has to be the one THIS repo has, and here that is
          # pages.yml -- not the deploy.yml most of the fleet carries. A wrong name
          # 404s only on the auto-merge path, and only after the merge has already
          # landed, which is the same silent non-deploy this step exists to stop.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run pages.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
